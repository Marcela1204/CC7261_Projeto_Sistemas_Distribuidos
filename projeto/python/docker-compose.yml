services:

  broker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: broker
    volumes:
      - ./broker.py:/app/main.py
    ports:
      - 5555:5555
      - 5556:5556

  broker2:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: broker2
    volumes:
      - ./broker2.py:/app/main.py
    ports:
      - 4445:4445
      - 4446:4446

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: proxy
    volumes:
      - ./proxy.py:/app/main.py
    ports:
      - 6665:6665
      - 6666:6666

  hearbeat:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    container_name: hearbeat
    volumes:
      - ./heartbeat.py.py:/app/main.py
    ports:
      - 7777:7777

  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    volumes:
      - ./servidor.py:/app/main.py
      - ./canais.txt:/app/canais.txt
    depends_on:
      - broker
      - broker2
      - proxy
    deploy:
      replicas: 1

  cliente:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc7261:pyzmq
    volumes:
      - ./cliente.py:/app/main.py
    depends_on:
      - servidor
    deploy:
      replicas: 1
