services:

  broker:
    build: .
    command: java -cp .:jeromq-0.5.3.jar Broker
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build: .
    command: java -cp .:jeromq-0.5.3.jar Proxy
    ports:
      - "5557:5557"
      - "5558:5558"

  reference:
    build: .
    command: java -cp .:jeromq-0.5.3.jar ReferenceServer
    ports:
      - "6000:6000"

  servidor-1:
    build: .
    hostname: servidor-1
    container_name: servidor-1
    command: java -cp .:jeromq-0.5.3.jar Servidor
    depends_on:
      - broker
      - proxy
      - reference

  servidor-2:
    build: .
    hostname: servidor-2
    container_name: servidor-2
    command: java -cp .:jeromq-0.5.3.jar Servidor
    depends_on:
      - broker
      - proxy
      - reference

  cliente:
    build: .
    command: java -cp .:jeromq-0.5.3.jar Cliente
    depends_on:
      - servidor-1
      - servidor-2
    deploy:
      replicas: 3