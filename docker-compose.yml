version: "3.9"

services:
  broker:
    build: ./projeto/python
    command: python Broker.py
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build: ./projeto/python
    command: python Proxy.py
    ports:
      - "5557:5557"
      - "5558:5558"

  reference:
    build: ./projeto/python
    command: python ReferenceServer.py
    ports:
      - "6000:6000"

  servidor-1:
    build: ./projeto/python
    hostname: servidor-1
    container_name: servidor-1
    command: python Servidor.py
    depends_on:
      - broker
      - proxy
      - reference

  servidor-2:
    build: ./projeto/python
    hostname: servidor-2
    container_name: servidor-2
    command: python Servidor.py
    depends_on:
      - broker
      - proxy
      - reference

  cliente-1:
    build: ./projeto/java
    container_name: cliente-1
    command: java -cp .:jeromq-0.5.3.jar Cliente
    depends_on:
      - servidor-1
      - servidor-2

  cliente-2:
    build: ./projeto/java
    container_name: cliente-2
    command: java -cp .:jeromq-0.5.3.jar Cliente
    depends_on:
      - servidor-1
      - servidor-2

  cliente-3:
    build: ./projeto/java
    container_name: cliente-3
    command: java -cp .:jeromq-0.5.3.jar Cliente
    depends_on:
      - servidor-1
      - servidor-2
